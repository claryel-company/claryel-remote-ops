name: Read knowledge publisher failure
on:
  pull_request:
    paths: [".github/workflows/read-knowledge-publisher-failure.yml"]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: publish-project-knowledge.yml
    steps:
      - name: Read latest main publisher result
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"; runs="$RUNNER_TEMP/runs.json"; jobs="$RUNNER_TEMP/jobs.json"
          gh api "/repos/$repo/actions/workflows/$TARGET_WORKFLOW/runs?branch=main&per_page=10" >"$runs"
          readarray -t facts < <(python3 - "$runs" <<'PY'
          from pathlib import Path
          import json,sys
          candidates=[r for r in json.loads(Path(sys.argv[1]).read_text())['workflow_runs'] if r.get('event') in {'push','schedule','workflow_dispatch'}]
          if not candidates: raise SystemExit('no main publisher run')
          r=candidates[0]
          print(r['id']); print(r.get('status') or ''); print(r.get('conclusion') or ''); print(r.get('head_sha') or '')
          PY
          )
          run_id="${facts[0]}"; printf 'run_id=%s status=%s conclusion=%s head_sha=%s\n' "$run_id" "${facts[1]}" "${facts[2]}" "${facts[3]}"
          gh api "/repos/$repo/actions/runs/$run_id/jobs?per_page=100" >"$jobs"
          python3 - "$jobs" <<'PY'
          from pathlib import Path
          import json,sys
          for j in json.loads(Path(sys.argv[1]).read_text())['jobs']: print(f"job={j.get('name')} status={j.get('status')} conclusion={j.get('conclusion')} id={j.get('id')}")
          PY
          job_id="$(python3 - "$jobs" <<'PY'
          from pathlib import Path
          import json,sys
          jobs=json.loads(Path(sys.argv[1]).read_text())['jobs']; matches=[j for j in jobs if j.get('name')=='publish']
          if not matches: raise SystemExit('publish job not found')
          print(matches[0]['id'])
          PY
          )"
          [[ "${facts[1]}" == completed ]] || exit 0
          log="$RUNNER_TEMP/publish.log"; gh api "/repos/$repo/actions/jobs/$job_id/logs" >"$log"
          grep -E -i 'status=|created=|updated=|unchanged=|missing=|failed=|published_sources|indexed_bytes|traceback|##\[error\]|error:|exception|constraint|duplicate|unsupported|permission|timeout|source_key|source_path' "$log" | tail -n 600 || true
          printf '%s\n' 'mutation=false'
