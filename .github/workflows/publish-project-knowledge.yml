name: Publish project knowledge
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: project-knowledge-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, linux, x64, claryel-deploy]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: trigger
        shell: bash
        run: |
          case "${GITHUB_EVENT_NAME}" in push) value=push;; schedule) value=schedule;; workflow_dispatch) value=manual;; *) value=reconcile;; esac
          printf 'value=%s\n' "$value" >>"$GITHUB_OUTPUT"
      - id: knowledge
        uses: claryel-company/claryel-boxcore/.github/actions/publish-project-knowledge@5ad36fbf81f30c6f9156010bd0fa9eb4ee1a7ae6
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          revision: ${{ github.sha }}
          default-branch: ${{ github.event.repository.default_branch }}
          visibility: private
          trigger-kind: ${{ steps.trigger.outputs.value }}
      - shell: bash
        run: |
          printf '%s\n' "status=${{ steps.knowledge.outputs.status }}" "created=${{ steps.knowledge.outputs.created }}" "updated=${{ steps.knowledge.outputs.updated }}" "unchanged=${{ steps.knowledge.outputs.unchanged }}" "missing=${{ steps.knowledge.outputs.missing }}" "failed=${{ steps.knowledge.outputs.failed }}"
